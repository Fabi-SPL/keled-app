name: Keled
options:
  bundleIdPrefix: com.fabi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Keled:
    type: application
    platform: iOS
    sources:
      - path: Keled
        excludes:
          - "**/Info.plist"
      - path: Shared
    dependencies:
      - target: KeledWidgets
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabi.keled
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Keled/Info.plist
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""

  KeledWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: KeledWidgets
        excludes:
          - "**/Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabi.keled.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: KeledWidgets/Info.plist
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: NO
