name: iOS check

# Compiles the app and the widget extension for the simulator, then screenshots
# every widget size on an iPhone and the home view on an iPad. Never signs and
# never injects the hub config, so the build renders the sample cards and the
# PNGs are safe to keep. This is the only place the Swift gets compiled: there
# is no Mac, so a red run here is the compiler talking.

# `widget.mjs preview` dispatches this with a session's cards (gzip + base64) and a tag it can
# find the run by; those runs also shoot the cards in preview-* screens, light and dark.
run-name: ${{ inputs.tag && format('iOS preview {0}', inputs.tag) || 'iOS check' }}

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-check.yml'
  workflow_dispatch:
    inputs:
      cards:
        description: 'Cards to preview: JSON, gzip, base64'
        required: false
        default: ''
      tag:
        description: 'Tag to find this run by'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Pushes replace each other; every preview run is its own, so two sessions never cancel each other.
  group: ios-check-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  screens:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Generate the project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          test -d Keled.xcodeproj

      - name: Pick an iPhone and an iPad simulator
        run: |
          xcrun simctl list -j devices available > /tmp/devices.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, re
          d = json.load(open("/tmp/devices.json"))["devices"]
          def ver(rt):
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          rts = sorted([k for k in d if "iOS" in k], key=ver, reverse=True)
          def pick(prefs, family):
              for p in prefs:
                  for rt in rts:
                      for dev in d[rt]:
                          if dev["name"] == p:
                              return dev["udid"], dev["name"], rt
              for rt in rts:
                  for dev in d[rt]:
                      if dev["name"].startswith(family):
                          return dev["udid"], dev["name"], rt
              raise SystemExit(f"no {family} simulator")
          phone = pick(["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 17", "iPhone 16"], "iPhone")
          pad = pick(["iPad Pro 13-inch (M5)", "iPad Pro 13-inch (M4)", "iPad Air 13-inch (M3)", "iPad Air 13-inch (M2)"], "iPad")
          print(f"PHONE={phone[0]}")
          print(f"PAD={pad[0]}")
          import sys
          print(f"phone {phone[1]} on {phone[2]} | pad {pad[1]} on {pad[2]}", file=sys.stderr)
          PY

      - name: Build for the simulator (app + widget extension)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Keled.xcodeproj \
            -scheme Keled \
            -configuration Debug \
            -destination "id=${PHONE}" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*Keled|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log || { echo "::error::simulator build failed"; grep -E "error:" build.log | head -40; exit 1; }
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Keled.app"
          test -d "$APP/PlugIns/KeledWidgets.appex" || { echo "::error::widget extension was not embedded"; exit 1; }
          for P in "$APP" "$APP/PlugIns/KeledWidgets.appex"; do
            test -f "$P/PrivacyInfo.xcprivacy" || { echo "::error::no privacy manifest in $(basename "$P")"; exit 1; }
          done
          echo "privacy manifests: app + widget"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Screenshot every widget size
        run: |
          mkdir -p shots
          # macOS has no timeout(1); a hung simctl call once held a run for 40 minutes.
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          shoot() {  # device, screen, file, [appearance], [dir]
            xcrun simctl ui "$1" appearance "${4:-light}"
            DATA=$(xcrun simctl get_app_container "$1" com.fabi.keled data)
            rm -f "$DATA/Documents/keled-screen-$2.ok"
            # Two tries: a busy runner sometimes loses the first relaunch on the second simulator.
            for try in 1 2; do
              t 60 xcrun simctl launch --terminate-running-process "$1" com.fabi.keled -KeledScreen "$2" -KeledDemo YES >/dev/null || echo "launch $2 did not return"
              for i in $(seq 1 60); do
                [ -f "$DATA/Documents/keled-screen-$2.ok" ] && break 2
                sleep 0.5
              done
              echo "screen $2 not drawn after 30 s, relaunching"
            done
            [ -f "$DATA/Documents/keled-screen-$2.ok" ] || { echo "::error::screen $2 never rendered"; xcrun simctl spawn "$1" log show --last 2m --predicate 'process == "Keled"' --style compact 2>/dev/null | tail -30; exit 1; }
            sleep 1
            t 30 xcrun simctl io "$1" screenshot "${5:-shots}/$3.png" >/dev/null
            echo "shot $3"
          }
          up() {
            xcrun simctl boot "$1" || true
            t 300 xcrun simctl bootstatus "$1" -b >/dev/null
            xcrun simctl status_bar "$1" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
            xcrun simctl install "$1" "$APP"
          }
          # One simulator at a time. With phone and iPad booted together the iPad launch hung
          # on three attempts in a row (run 38700938634); the phone shuts down before the iPad boots.
          # A preview needs only the phone and only its own cards: about a third of the time.
          up "$PHONE"
          if [ -z "$PREVIEW_CARDS" ]; then
            for S in small medium large lock board home themed themed2; do shoot "$PHONE" "$S" "iphone-$S"; done
            shoot "$PHONE" medium iphone-medium-dark dark
            shoot "$PHONE" home iphone-home-dark dark
            shoot "$PHONE" themed iphone-themed-dark dark
            xcrun simctl shutdown "$PHONE" || true
            up "$PAD"
            shoot "$PAD" home ipad-home
            shoot "$PAD" board ipad-board
          fi
          if [ -n "$PREVIEW_CARDS" ]; then
            DATA=$(xcrun simctl get_app_container "$PHONE" com.fabi.keled data)
            mkdir -p "$DATA/Documents"
            # Sealed by hub/seal.mjs: this repo is public, so real cards never appear in a log or artifact.
            [ -n "$KELED_PREVIEW_KEY" ] || { echo "::error::KELED_PREVIEW_KEY secret missing"; exit 1; }
            mkdir -p pv
            printf '%s' "$PREVIEW_CARDS" | base64 --decode | node hub/seal.mjs open | gunzip > "$DATA/Documents/preview-cards.json"
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('preview cards:', len(d['cards'] if isinstance(d, dict) else d))" "$DATA/Documents/preview-cards.json"
            for S in preview-small preview-medium preview-large; do
              shoot "$PHONE" "$S" "$S" light pv
              shoot "$PHONE" "$S" "$S-dark" dark pv
            done
          fi
          ls -la shots
        env:
          PREVIEW_CARDS: ${{ inputs.cards }}
          KELED_PREVIEW_KEY: ${{ secrets.KELED_PREVIEW_KEY }}

      - name: Seal the preview shots
        if: always() && inputs.cards != ''
        run: |
          mkdir -p sealed
          for f in pv/*.png; do [ -f "$f" ] && node hub/seal.mjs seal < "$f" > "sealed/$(basename "$f").enc"; done
          rm -rf pv
          ls sealed
        env:
          KELED_PREVIEW_KEY: ${{ secrets.KELED_PREVIEW_KEY }}

      - name: Keep the sealed preview
        if: always() && inputs.cards != ''
        uses: actions/upload-artifact@v4
        with:
          name: keled-preview
          path: sealed/*.enc
          retention-days: 3
          if-no-files-found: ignore

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keled-screens
          path: shots/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          retention-days: 3
          if-no-files-found: ignore
